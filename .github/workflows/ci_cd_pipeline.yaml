name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'configs/**'
      - '.github/workflows/**'
      - 'scripts/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'configs/**'
      - '.github/workflows/**'
      - 'scripts/**'

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/sentiment-mlops
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-xdist flake8 black isort

    - name: Download NLTK data
      run: python scripts/download_nltk.py

    - name: Run unit tests
      run: pytest tests/unit/ -v --cov=src --cov-report=xml --cov-report=html -n 0

    - name: Run integration tests
      run: |
        if [ -d "tests/integration" ]; then
          pytest tests/integration/ -v --tb=short
        else
          echo "No integration tests found, skipping"
        fi

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

    - name: Lint code
      run: |
        flake8 src tests --max-line-length=120 || echo "Linting warnings found"
        black --check src tests || echo "Black formatting issues found"
        isort --check-only src tests || echo "Import sorting issues found"
      continue-on-error: true

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: deployments/docker/Dockerfile
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy-kubeflow:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Configure kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'latest'

    - name: Deploy Kubeflow pipeline
      run: |
        if [ -z "${{ secrets.KUBECONFIG }}" ]; then
          echo "KUBECONFIG secret not set, skipping Kubeflow deployment"
          exit 0
        fi
        
        echo "${{ secrets.KUBECONFIG }}" | base64 --decode > kubeconfig
        export KUBECONFIG=$(pwd)/kubeconfig
        
        kubectl cluster-info || {
          echo "Failed to connect to cluster"
          exit 1
        }
        
        if [ -f "src/kubeflow/pipeline_definition.py" ]; then
          python src/kubeflow/pipeline_definition.py
        else
          echo "Pipeline definition not found, skipping"
        fi
        
        if [ -f "deployments/kubernetes/kfp-runner.yaml" ]; then
          kubectl apply -f deployments/kubernetes/kfp-runner.yaml
        else
          echo "Deployment manifest not found, skipping"
        fi
